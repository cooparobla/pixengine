# pixengine configuration file
# All settings have sensible defaults if missing or omitted.

# Which scenes to load at startup -- world (Transform2D/SpriteRenderer/
# Camera2D/...) and HUD (a separate uicoopa Scene; world and UI coordinate
# systems don't mix in one tree).
scene:
  default_scene: "assets/scenes/farm/scene.yaml"
  hud_scene: "assets/scenes/hud/scene.yaml"

# Window and display settings
window:
  title: "pixengine"                  # Window title bar text
  width: 1280                         # Window width in pixels
  height: 720                         # Window height in pixels
  vsync: true                         # Enable vertical synchronization (VSync)
  resizable: true                     # Allow the user to resize the window

# The world's field of view: a fixed reference resolution, uniformly
# (fractionally, not integer-locked) best-fit scaled to whatever window it's
# rendered into, centered, with letterbox/pillarbox space on whichever axis
# has room to spare. Resizing the window changes how BIG that fixed view
# renders, not how much world is visible in it. This is NOT a return to a
# low-res offscreen buffer or pixel snapping -- sprites still render directly
# at native resolution, continuous positions; only the on-screen SIZE and
# visible extent of the world are governed by this reference resolution.
canvas:
  reference_width: 480                # Reference resolution width, in pixels
  reference_height: 270               # Reference resolution height, in pixels
  pixels_per_unit: 16.0               # Source .pix pixels per world unit (matches sprite assets' own pixels_per_unit)

# Sprite render pass tuning
renderer:
  max_textures: 256                   # Upper bound on distinct sprite atlases drawn in a single frame

# AssetManager + residency streaming tuning (streamed sprite acquire/release
# as objects enter/leave the camera's visible rect)
assets:
  io_threads: 2                       # AssetManager background decode thread count
  idle_eviction: true                 # Evict GPU-resident assets that have sat unused past max_idle_frames
  max_idle_frames: 60                 # Frames an unused asset stays resident before eviction (~1s at 60fps)
  max_acquires_per_frame: 4           # Caps new sprite loads issued per frame (throttles upload stalls)
  release_delay_frames: 30            # Hysteresis before dropping a handle that just left the visible+margin rect
  residency_margin: 4.0               # World units of prefetch margin around the camera's visible rect
